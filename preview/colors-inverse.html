<!doctype html>
<!-- @dsCard group="Colors" name="Inverse surfaces" subtitle="Ink blocks — night ramp plus on-ink foreground tokens" viewport="700x260" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inverse surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { padding:28px 32px; background:var(--paper); }
  .lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
          color:var(--ink-4); margin:0 0 6px; }
  .sw-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:10px; }
  .sw { height:64px; border:1px solid var(--paper-3); display:flex; align-items:flex-end; padding:6px; }
  .sw span { font-family:var(--font-mono); font-size:9px; letter-spacing:0.06em; }
  .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
</style>
</head>
<body>
<p class="lbl" style="color:var(--ink-4)">Night — inverse backgrounds</p><div class="sw-grid">
<div class="sw" style="background:var(--night)"><span style="color:var(--paper)">night</span></div>
<div class="sw" style="background:var(--night-2)"><span style="color:var(--paper)">night-2</span></div>
<div class="sw" style="background:var(--night-3)"><span style="color:var(--paper)">night-3</span></div>
</div><p class="lbl" style="margin-top:18px;color:var(--ink-4)">Foreground on ink</p><div class="sw-grid"><div class="sw" style="background:var(--ink);border-color:var(--rule-on-ink)"><span style="color:var(--fg-on-ink)">fg-on-ink</span></div><div class="sw" style="background:var(--ink);border-color:var(--rule-on-ink)"><span style="color:var(--fg-on-ink-2)">fg-on-ink-2</span></div><div class="sw" style="background:var(--pink)"><span style="color:var(--fg-on-pink)">fg-on-pink</span></div></div>
</body>
</html>
