<!doctype html>
<!-- @dsCard group="Type" name="Mono — structural metadata" subtitle="Eyebrows, §NN markers, No.NN numerals, code" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mono — structural metadata</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { padding:28px 32px; background:var(--paper); }
  .lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
          color:var(--ink-4); margin:0 0 6px; }
  .sw-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:10px; }
  .sw { height:64px; border:1px solid var(--paper-3); display:flex; align-items:flex-end; padding:6px; }
  .sw span { font-family:var(--font-mono); font-size:9px; letter-spacing:0.06em; }
  .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
</style>
</head>
<body>
<p class="lbl">.eyebrow</p><p class="eyebrow" style="margin:0 0 16px">§01 &nbsp; The back catalogue</p><p class="lbl">.numeral</p><p class="numeral" style="margin:0 0 16px;font-size:22px">No.01 &nbsp; No.02 &nbsp; No.14</p><p class="lbl">.label</p><p class="label" style="margin:0 0 16px">Filed under</p><p class="lbl">code</p><p class="body" style="margin:0">Inline <code>kubectl get pods</code> in the body.</p>
</body>
</html>
