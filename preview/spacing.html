<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base — s-1 through s-12" viewport="700x300" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { padding:28px 32px; background:var(--paper); }
  .lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
          color:var(--ink-4); margin:0 0 6px; }
  .sw-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:10px; }
  .sw { height:64px; border:1px solid var(--paper-3); display:flex; align-items:flex-end; padding:6px; }
  .sw span { font-family:var(--font-mono); font-size:9px; letter-spacing:0.06em; }
  .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
</style>
</head>
<body>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:5px"><span class="lbl" style="width:52px;margin:0">s-1</span><div style="height:14px;width:var(--s-1);background:var(--pink)"></div><span class="lbl" style="margin:0;color:var(--ink-3)">4px</span></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:5px"><span class="lbl" style="width:52px;margin:0">s-2</span><div style="height:14px;width:var(--s-2);background:var(--pink)"></div><span class="lbl" style="margin:0;color:var(--ink-3)">8px</span></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:5px"><span class="lbl" style="width:52px;margin:0">s-3</span><div style="height:14px;width:var(--s-3);background:var(--pink)"></div><span class="lbl" style="margin:0;color:var(--ink-3)">12px</span></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:5px"><span class="lbl" style="width:52px;margin:0">s-4</span><div style="height:14px;width:var(--s-4);background:var(--pink)"></div><span class="lbl" style="margin:0;color:var(--ink-3)">16px</span></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:5px"><span class="lbl" style="width:52px;margin:0">s-5</span><div style="height:14px;width:var(--s-5);background:var(--pink)"></div><span class="lbl" style="margin:0;color:var(--ink-3)">24px</span></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:5px"><span class="lbl" style="width:52px;margin:0">s-6</span><div style="height:14px;width:var(--s-6);background:var(--pink)"></div><span class="lbl" style="margin:0;color:var(--ink-3)">32px</span></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:5px"><span class="lbl" style="width:52px;margin:0">s-7</span><div style="height:14px;width:var(--s-7);background:var(--pink)"></div><span class="lbl" style="margin:0;color:var(--ink-3)">48px</span></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:5px"><span class="lbl" style="width:52px;margin:0">s-8</span><div style="height:14px;width:var(--s-8);background:var(--pink)"></div><span class="lbl" style="margin:0;color:var(--ink-3)">64px</span></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:5px"><span class="lbl" style="width:52px;margin:0">s-9</span><div style="height:14px;width:var(--s-9);background:var(--pink)"></div><span class="lbl" style="margin:0;color:var(--ink-3)">96px</span></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:5px"><span class="lbl" style="width:52px;margin:0">s-10</span><div style="height:14px;width:var(--s-10);background:var(--pink)"></div><span class="lbl" style="margin:0;color:var(--ink-3)">128px</span></div>
</body>
</html>
