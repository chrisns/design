<!doctype html>
<!-- @dsCard group="Brand" name="Logo lockups" subtitle="Wordmark on cream, on ink, pink; monogram" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo lockups</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { padding:28px 32px; background:var(--paper); }
  .lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
          color:var(--ink-4); margin:0 0 6px; }
  .sw-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:10px; }
  .sw { height:64px; border:1px solid var(--paper-3); display:flex; align-items:flex-end; padding:6px; }
  .sw span { font-family:var(--font-mono); font-size:9px; letter-spacing:0.06em; }
  .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
</style>
</head>
<body>
<div class="row"><img src="../assets/logos/cns-wordmark.svg" width="150" alt="cns.me"><img src="../assets/logos/cns-wordmark-pink.svg" width="150" alt="cns.me pink"><img src="../assets/logos/cns-monogram.svg" width="64" alt="monogram"></div><div class="row" style="background:var(--ink);padding:18px;margin:0"><img src="../assets/logos/cns-wordmark-inverse.svg" width="150" alt="cns.me on ink"></div>
</body>
</html>
