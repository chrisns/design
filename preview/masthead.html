<!doctype html>
<!-- @dsCard group="Components" name="Masthead" subtitle="Wordmark, nav, meta strip — talks.cns.me" viewport="900x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Masthead</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/talks/talks.css">
<style>
  html,body { margin:0; }
  body { padding:28px 32px; background:var(--paper); }
  .prev-note { font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em;
                text-transform:uppercase; color:var(--ink-4); margin:0 0 14px; }
</style>
</head>
<body>
<div class="page"><header class="masthead">
 <svg aria-hidden="true" class="masthead-guilloche" preserveaspectratio="xMidYMid slice" viewbox="0 0 1600 120">
  <defs>
   <pattern height="48" id="masthead-weave" patternunits="userSpaceOnUse" width="48" x="0" y="0">
    <path d="M 0 24 Q 12 0 24 24 T 48 24" fill="none" stroke="currentColor" stroke-width="0.5">
    </path>
    <path d="M 0 24 Q 12 48 24 24 T 48 24" fill="none" stroke="currentColor" stroke-width="0.5">
    </path>
   </pattern>
  </defs>
  <g class="guilloche-drift">
   <rect fill="url(#masthead-weave)" height="120" width="2000" x="-200" y="0">
   </rect>
  </g>
 </svg>
 <div class="rule top draw-rule">
 </div>
 <div class="masthead-row">
  <a class="brand" href="https://cns.me">
   <span class="brand-cns">
    cns
   </span>
   <span class="brand-dot">
   </span>
   <span class="brand-me">
    me
   </span>
   <span class="brand-blog">
    / talks
   </span>
   <svg aria-hidden="true" class="brand-flourish" preserveaspectratio="none" viewbox="0 0 220 14">
    <path d="M 2 8 C 30 2, 70 12, 110 6 S 190 4, 218 8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1">
    </path>
   </svg>
  </a>
  <span class="masthead-meta">
   <em>
    A back catalogue
   </em>
  </span>
 </div>
 <div class="rule draw-rule delay-1">
 </div>
 <nav class="masthead-nav">
  <div class="nav-left">
   <a href="#talks">
    Talks
   </a>
   <a href="#gov">
    Gov.uk
   </a>
   <a href="#schedule">
    Schedule
   </a>
  </div>
  <div class="nav-right">
   <a href="https://cns.me">
    LinkedIn
   </a>
   <a href="https://blog.cns.me">
    Blog
   </a>
   <a href="https://devpsyops.com">
    DevPsyOps
   </a>
   <a href="https://github.com/chrisns">
    GitHub
   </a>
  </div>
 </nav>
 <div class="rule draw-rule delay-2">
 </div>
</header>
</div>
</body>
</html>
