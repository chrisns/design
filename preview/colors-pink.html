<!doctype html>
<!-- @dsCard group="Colors" name="Brand pink" subtitle="The trousers — hex-pinned brand + oklch ramp" viewport="700x300" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand pink</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { padding:28px 32px; background:var(--paper); }
  .lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
          color:var(--ink-4); margin:0 0 6px; }
  .sw-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:10px; }
  .sw { height:64px; border:1px solid var(--paper-3); display:flex; align-items:flex-end; padding:6px; }
  .sw span { font-family:var(--font-mono); font-size:9px; letter-spacing:0.06em; }
  .row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
</style>
</head>
<body>
<p class="lbl">Brand — hex pinned</p><div class="sw-grid">
<div class="sw" style="background:var(--pink)"><span style="color:var(--bone)">pink #E5197F</span></div>
<div class="sw" style="background:var(--pink-hot)"><span style="color:var(--bone)">hot #FF2D8A</span></div>
<div class="sw" style="background:var(--pink-deep)"><span style="color:var(--bone)">deep #B30E61</span></div>
<div class="sw" style="background:var(--pink-ink)"><span style="color:var(--bone)">ink #5A0830</span></div>
</div><p class="lbl" style="margin-top:18px">Ramp — oklch 350°</p><div class="sw-grid">
<div class="sw" style="background:var(--pink-50)"><span style="color:var(--ink)">50</span></div>
<div class="sw" style="background:var(--pink-100)"><span style="color:var(--ink)">100</span></div>
<div class="sw" style="background:var(--pink-200)"><span style="color:var(--ink)">200</span></div>
<div class="sw" style="background:var(--pink-300)"><span style="color:var(--ink)">300</span></div>
<div class="sw" style="background:var(--pink-400)"><span style="color:var(--bone)">400</span></div>
<div class="sw" style="background:var(--pink-500)"><span style="color:var(--bone)">500</span></div>
<div class="sw" style="background:var(--pink-600)"><span style="color:var(--bone)">600</span></div>
<div class="sw" style="background:var(--pink-700)"><span style="color:var(--bone)">700</span></div>
<div class="sw" style="background:var(--pink-800)"><span style="color:var(--bone)">800</span></div>
<div class="sw" style="background:var(--pink-900)"><span style="color:var(--bone)">900</span></div>
</div>
</body>
</html>
