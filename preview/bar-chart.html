<!doctype html>
<!-- @dsCard group="App — GovBuy" name="Bar rows" subtitle="Labelled horizontal bars with value + sub" viewport="700x300" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bar rows</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ui_kits/govbuy/govbuy.css">
<style>
  html,body { margin:0; }
  body { padding:28px 32px; background:var(--paper); }
  .prev-note { font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em;
                text-transform:uppercase; color:var(--ink-4); margin:0 0 14px; }
</style>
</head>
<body>
<div class="page"><div class="bars">
 <div class="bar-row">
  <div class="bar-label">
   Open tender
  </div>
  <div class="bar-track">
   <div class="bar-fill bf-ink" style="width:100.0%">
   </div>
  </div>
  <div class="bar-val numeral">
   £1.0tn
   <span class="bar-sub">
    · 165,173
   </span>
  </div>
 </div>
 <div class="bar-row">
  <div class="bar-label">
   Other / unclassified
  </div>
  <div class="bar-track">
   <div class="bar-fill bf-ink" style="width:32.0%">
   </div>
  </div>
  <div class="bar-val numeral">
   £334bn
   <span class="bar-sub">
    · 129,218
   </span>
  </div>
 </div>
 <div class="bar-row">
  <div class="bar-label">
   Framework call-off
  </div>
  <div class="bar-track">
   <div class="bar-fill bf-pink" style="width:13.7%">
   </div>
  </div>
  <div class="bar-val numeral">
   £143bn
   <span class="bar-sub">
    · 114,313
   </span>
  </div>
 </div>
 <div class="bar-row">
  <div class="bar-label">
   Direct award
  </div>
  <div class="bar-track">
   <div class="bar-fill bf-ink" style="width:4.1%">
   </div>
  </div>
  <div class="bar-val numeral">
   £43bn
   <span class="bar-sub">
    · 66,120
   </span>
  </div>
 </div>
 <div class="bar-row">
  <div class="bar-label">
   DPS call-off
  </div>
  <div class="bar-track">
   <div class="bar-fill bf-pink" style="width:3.4%">
   </div>
  </div>
  <div class="bar-val numeral">
   £36bn
   <span class="bar-sub">
    · 19,699
   </span>
  </div>
 </div>
</div>
</div>
</body>
</html>
